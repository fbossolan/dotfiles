# --- core ---
set -g prefix C-b
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g status-position top
setw -g mode-keys vi
set -s escape-time 10
set -g focus-events on                  # nvim: FocusGained -> checktime
set -s default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"      # truecolor

# --- reload ---
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- panes ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- copy mode ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# --- popups ---
bind N display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind S command-prompt -p "Session name:" "new-session -d -s '%%' ; switch-client -t '%%'"
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind e display-popup -d "#{pane_current_path}" -w 75% -h 75% -E "zsh"
bind m display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  ".zshrc"              z  "display-popup -E 'nvim ~/.zshrc'" \
  ".tmux.conf"          t  "display-popup -E 'nvim ~/.tmux.conf'" \
  "init.lua"            v  "display-popup -E 'nvim ~/.config/nvim/init.lua'" \
  "~/scratch.txt"       s  "display-popup -E 'nvim ~/scratch.txt'" \
  "~/kb_shortcuts.txt"  k  "display-popup -E 'nvim ~/kb_shortcuts.txt'" \
  "aerospace config"    a  "display-popup -E 'nvim ~/.config/aerospace/aerospace.toml'" \
  "Exit"                q  ""

# --- theme: Catppuccin Mocha ---
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left  "#[fg=#1e1e2e,bg=#fab387,bold] ● #S #[fg=#fab387,bg=default] "
set -g status-right "#[fg=#b4befe,bg=default] | #[fg=#b4befe,bold]#H #[fg=#89dceb,bg=default] | #[fg=#89dceb,bold]%H:%M "

setw -g window-status-style         'fg=#bac2de bg=#45475a'
setw -g window-status-format        " #I:#W "
setw -g window-status-current-style 'fg=#1e1e2e bg=#cba6f7 bold'
setw -g window-status-current-format " #I:#W "

set -g pane-border-style        'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style            'fg=#1e1e2e bg=#f2cdcd bold'
